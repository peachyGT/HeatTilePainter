// Adds only hidden persistence/render state to parts.
// All interaction is in the dedicated Heat Tile Painter editor window.
@PART[*]:HAS[~category[none],!MODULE[KerbalEVA],!MODULE[ModuleConformalDecal],!MODULE[ModuleConformalFlag],!MODULE[ModuleConformalText],!MODULE[ModuleHeatTileOverlay]]:FINAL
{
    MODULE
    {
        name = ModuleHeatTileOverlay
        surfaceOffset = 0.0
    }
}

// Runtime-only renderer owned by Heat Tile Painter. It has no UI and saves no editable state;
// ModuleHeatTileOverlay derives its complete input from layerData after each load/edit.
@PART[*]:HAS[~category[none],!MODULE[KerbalEVA],!MODULE[ModuleConformalDecal],!MODULE[ModuleConformalFlag],!MODULE[ModuleConformalText],!MODULE[ModuleHeatTileReforgedCore]]:FINAL
{
    MODULE
    {
        name = ModuleHeatTileReforgedCore
    }
}

